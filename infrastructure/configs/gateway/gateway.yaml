apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gke-gateway
  namespace: flagger-system # Creating it in the controller namespace is fine for cluster-wide routing initially
spec:
  gatewayClassName: gke-l7-regional-external-managed # Standard Cloud Load Balancer
  listeners:
  - name: http
    protocol: HTTP
    port: 80
