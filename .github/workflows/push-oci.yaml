name: Push OCI Artifact

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flux
        uses: fluxcd/flux2/action@main

      - name: Validate manifests
        run: |
          # Validate every app base and every rendered environment overlay
          for base in apps/base/*; do
            kustomize build "$base"
          done
          for overlay in apps/dev/dev-*; do
            kustomize build "$overlay"
          done

  push-oci:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: 'projects/216611239488/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'flux-github-actions@dev-sandbox-386907.iam.gserviceaccount.com'

      - name: Setup Flux
        uses: fluxcd/flux2/action@main

      - name: Login to GAR
        uses: docker/login-action@v4
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Push OCI Artifact
        run: |
          # Use Git SHA for main branch, or the tag name for releases
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
          else
            TAG=${GITHUB_SHA}
          fi

          flux push artifact oci://us-central1-docker.pkg.dev/dev-sandbox-386907/flux-manifests-dev/dev-env:${TAG} \
            --path="." \
            --source="${{ github.repositoryUrl }}" \
            --revision="${{ github.ref_name }}/${{ github.sha }}" \
            --ignore-paths=".github/,README.md,.gitignore"

          # Also tag as 'latest' for the main branch push
          if [[ $GITHUB_REF == refs/heads/main ]]; then
            flux tag artifact oci://us-central1-docker.pkg.dev/dev-sandbox-386907/flux-manifests-dev/dev-env:${TAG} \
              --tag latest
          fi
