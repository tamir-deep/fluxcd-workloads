apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-configs
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./clusters/dev/infrastructure-configs
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
  timeout: 5m0s
  dependsOn:
    - name: infrastructure
